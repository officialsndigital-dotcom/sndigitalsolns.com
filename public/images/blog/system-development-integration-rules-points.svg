<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img">
  <rect width="1200" height="650" rx="18" fill="#f6f8fb" stroke="#dfe4ee" stroke-width="2"/>
  <rect x="0" y="0" width="10" height="650" rx="5" fill="#eaa225"/>
  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">The short list</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Start system development integration earliest, not last</text><line x1="168" y1="201" x2="1136" y2="201" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="235" r="21" fill="#10214a"/><text x="112" y="243" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="243" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">The other system's documentation is a hypothesis</text><line x1="168" y1="268" x2="1136" y2="268" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="302" r="21" fill="#10214a"/><text x="112" y="310" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="310" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Decide what system development integration does when the other side is</text><text x="168" y="342" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">down</text><line x1="168" y1="367" x2="1136" y2="367" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="401" r="21" fill="#10214a"/><text x="112" y="409" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="409" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Agree who owns the truth for each field</text><line x1="168" y1="434" x2="1136" y2="434" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="468" r="21" fill="#10214a"/><text x="112" y="476" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="476" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Log the conversation, not just the result</text><line x1="168" y1="501" x2="1136" y2="501" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="535" r="21" fill="#10214a"/><text x="112" y="543" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="543" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">System development integration needs a named owner on both sides</text>
  <text x="1136" y="624" fill="#4a5672" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="600">sndigitalsolns.com</text>
</svg>
