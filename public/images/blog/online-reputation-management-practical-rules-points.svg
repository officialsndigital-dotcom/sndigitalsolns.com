<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="751" viewBox="0 0 1200 751" role="img">
  <rect width="1200" height="751" rx="18" fill="#f6f8fb" stroke="#dfe4ee" stroke-width="2"/>
  <rect x="0" y="0" width="10" height="751" rx="5" fill="#eaa225"/>
  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">At a glance</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Removal is rare, and that is the starting point</text><line x1="168" y1="201" x2="1136" y2="201" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="235" r="21" fill="#10214a"/><text x="112" y="243" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="243" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Work out what people actually search</text><line x1="168" y1="268" x2="1136" y2="268" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="302" r="21" fill="#10214a"/><text x="112" y="310" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="310" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Own the assets you control first</text><line x1="168" y1="335" x2="1136" y2="335" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="368" r="21" fill="#10214a"/><text x="112" y="376" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="376" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Answer the bad review properly, once</text><line x1="168" y1="401" x2="1136" y2="401" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="435" r="21" fill="#10214a"/><text x="112" y="443" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="443" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Volume of genuine reviews beats defending one bad one</text><line x1="168" y1="468" x2="1136" y2="468" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="502" r="21" fill="#10214a"/><text x="112" y="510" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="510" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Online reputation management is slow by design</text><line x1="168" y1="535" x2="1136" y2="535" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="569" r="21" fill="#10214a"/><text x="112" y="577" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">7</text><text x="168" y="577" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Avoid the tactics that make it worse</text><line x1="168" y1="602" x2="1136" y2="602" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="635" r="21" fill="#10214a"/><text x="112" y="643" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">8</text><text x="168" y="643" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Decide what you will not fight</text>
  <text x="1136" y="725" fill="#4a5672" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="600">sndigitalsolns.com</text>
</svg>
