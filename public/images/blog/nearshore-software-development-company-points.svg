<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="716" viewBox="0 0 1200 716" role="img">
  <rect width="1200" height="716" rx="18" fill="#f6f8fb" stroke="#dfe4ee" stroke-width="2"/>
  <rect x="0" y="0" width="10" height="716" rx="5" fill="#eaa225"/>
  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">The short list</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">A nearshore software development company's overlapping hours only</text><text x="168" y="209" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">help if someone uses them</text><line x1="168" y1="234" x2="1136" y2="234" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="268" r="21" fill="#10214a"/><text x="112" y="276" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="276" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Cost is the weakest reason to hire a nearshore software development</text><text x="168" y="308" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">company</text><line x1="168" y1="333" x2="1136" y2="333" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="367" r="21" fill="#10214a"/><text x="112" y="375" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="375" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Ask which nearshore software development company owns the</text><text x="168" y="408" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">architecture</text><line x1="168" y1="433" x2="1136" y2="433" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="467" r="21" fill="#10214a"/><text x="112" y="475" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="475" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What a nearshore software development company cannot fix</text><line x1="168" y1="500" x2="1136" y2="500" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="533" r="21" fill="#10214a"/><text x="112" y="541" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="541" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Check the handover before you need it</text><line x1="168" y1="566" x2="1136" y2="566" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="600" r="21" fill="#10214a"/><text x="112" y="608" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="608" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Judge the first month on communication, not velocity</text>
  <text x="1136" y="690" fill="#4a5672" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="600">sndigitalsolns.com</text>
