  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">The short list</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">A nearshore software development company's overlapping hours only help</text><text x="168" y="209" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">if someone uses them</text><line x1="168" y1="234" x2="1136" y2="234" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="268" r="21" fill="#10214a"/><text x="112" y="276" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="276" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Cost is the weakest reason to hire a nearshore software development</text><text x="168" y="308" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">company</text><line x1="168" y1="333" x2="1136" y2="333" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="367" r="21" fill="#10214a"/><text x="112" y="375" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="375" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Ask which nearshore software development company owns the architecture</text><line x1="168" y1="400" x2="1136" y2="400" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="434" r="21" fill="#10214a"/><text x="112" y="442" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="442" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What a nearshore software development company cannot fix</text><line x1="168" y1="467" x2="1136" y2="467" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="501" r="21" fill="#10214a"/><text x="112" y="509" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="509" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Check the handover before you need it</text><line x1="168" y1="534" x2="1136" y2="534" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="567" r="21" fill="#10214a"/><text x="112" y="575" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="575" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Judge the first month on communication, not velocity</text>
