-serif" font-size="26" font-weight="600">No single decision maker</text><line x1="168" y1="467" x2="1136" y2="467" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="501" r="21" fill="#10214a"/><text x="112" y="509" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="509" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Training treated as the last line of the plan</text><line x1="168" y1="534" x2="1136" y2="534" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="567" r="21" fill="#10214a"/><text x="112" y="575" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="575" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">No answer for who maintains it in year three</text>
