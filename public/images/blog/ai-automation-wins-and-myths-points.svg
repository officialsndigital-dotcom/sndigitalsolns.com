  <rect x="0" y="0" width="10" height="1018" rx="5" fill="#eaa225"/>
  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">At a glance</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Ai automation for documents that arrive as a mess</text><line x1="168" y1="201" x2="1136" y2="201" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="235" r="21" fill="#10214a"/><text x="112" y="243" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="243" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Routing and triage</text><line x1="168" y1="268" x2="1136" y2="268" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="302" r="21" fill="#10214a"/><text x="112" y="310" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="310" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Ai automation that drafts the first version</text><line x1="168" y1="335" x2="1136" y2="335" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="368" r="21" fill="#10214a"/><text x="112" y="376" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="376" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Structuring free text</text><line x1="168" y1="401" x2="1136" y2="401" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="435" r="21" fill="#10214a"/><text x="112" y="443" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="443" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Ai automation for internal search that answers</text><line x1="168" y1="468" x2="1136" y2="468" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="502" r="21" fill="#10214a"/><text x="112" y="510" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="510" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Checks that nobody enjoys</text><line x1="168" y1="535" x2="1136" y2="535" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="569" r="21" fill="#10214a"/><text x="112" y="577" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">7</text><text x="168" y="577" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Handover notes and logging</text><line x1="168" y1="602" x2="1136" y2="602" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="635" r="21" fill="#10214a"/><text x="112" y="643" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">8</text><text x="168" y="643" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Connecting the systems you already pay for</text><line x1="168" y1="668" x2="1136" y2="668" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="702" r="21" fill="#10214a"/><text x="112" y="710" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">9</text><text x="168" y="710" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">It removes headcount in the first year</text><line x1="168" y1="735" x2="1136" y2="735" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="769" r="21" fill="#10214a"/><text x="112" y="777" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">10</text><text x="168" y="777" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Accuracy is a solved problem</text><line x1="168" y1="802" x2="1136" y2="802" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="836" r="21" fill="#10214a"/><text x="112" y="844" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">11</text><text x="168" y="844" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">You need your own model</text><line x1="168" y1="869" x2="1136" y2="869" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="902" r="21" fill="#10214a"/><text x="112" y="910" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">12</text><text x="168" y="910" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Start with the most visible process</text>
