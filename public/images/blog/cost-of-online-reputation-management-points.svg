<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="717" viewBox="0 0 1200 717" role="img">
  <rect width="1200" height="717" rx="18" fill="#f6f8fb" stroke="#dfe4ee" stroke-width="2"/>
  <rect x="0" y="0" width="10" height="717" rx="5" fill="#eaa225"/>
  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">At a glance</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What is on page one sets the cost of online reputation management</text><line x1="168" y1="201" x2="1136" y2="201" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="235" r="21" fill="#10214a"/><text x="112" y="243" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="243" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">How many names you protect multiplies the cost of online reputation</text><text x="168" y="276" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">management</text><line x1="168" y1="301" x2="1136" y2="301" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="334" r="21" fill="#10214a"/><text x="112" y="342" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="342" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Whether you can publish</text><line x1="168" y1="367" x2="1136" y2="367" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="401" r="21" fill="#10214a"/><text x="112" y="409" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="409" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Monitoring and intervention are priced differently</text><line x1="168" y1="434" x2="1136" y2="434" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="468" r="21" fill="#10214a"/><text x="112" y="476" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="476" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Review generation is often the cheapest fix</text><line x1="168" y1="501" x2="1136" y2="501" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="535" r="21" fill="#10214a"/><text x="112" y="543" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="543" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Legal work is separate and it is not cheap</text><line x1="168" y1="568" x2="1136" y2="568" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="601" r="21" fill="#10214a"/><text x="112" y="609" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">7</text><text x="168" y="609" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">The real cost of online reputation management is time</text>
  <text x="1136" y="691" fill="#4a5672" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="600">sndigitalsolns.com</text>
</svg>
