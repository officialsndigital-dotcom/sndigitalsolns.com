  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">At a glance</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Which newsrooms does the public relations agency in Dubai actually</text><text x="168" y="209" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">place in?</text><line x1="168" y1="234" x2="1136" y2="234" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="268" r="21" fill="#10214a"/><text x="112" y="276" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="276" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Do you work in Arabic, or translate into it?</text><line x1="168" y1="301" x2="1136" y2="301" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="334" r="21" fill="#10214a"/><text x="112" y="342" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="342" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What does a public relations agency in Dubai know about my regulator?</text><line x1="168" y1="367" x2="1136" y2="367" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="401" r="21" fill="#10214a"/><text x="112" y="409" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="409" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">How does a public relations agency in Dubai measure a result?</text><line x1="168" y1="434" x2="1136" y2="434" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="468" r="21" fill="#10214a"/><text x="112" y="476" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="476" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Who is on the account when the public relations agency in Dubai is</text><text x="168" y="509" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">busy?</text><line x1="168" y1="534" x2="1136" y2="534" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="567" r="21" fill="#10214a"/><text x="112" y="575" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="575" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What happens when the story is bad?</text><line x1="168" y1="600" x2="1136" y2="600" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="634" r="21" fill="#10214a"/><text x="112" y="642" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">7</text><text x="168" y="642" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What would make you tell us to stop?</text>
  <text x="1136" y="724" fill="#4a5672" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="600">sndigitalsolns.com</text>
