<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="782" viewBox="0 0 1200 782" role="img">
  <rect width="1200" height="782" rx="18" fill="#f6f8fb" stroke="#dfe4ee" stroke-width="2"/>
  <rect x="0" y="0" width="10" height="782" rx="5" fill="#eaa225"/>
  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">At a glance</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Which newsrooms does the public relations agency in Dubai actually</text><text x="168" y="209" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">place in?</text><line x1="168" y1="234" x2="1136" y2="234" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="268" r="21" fill="#10214a"/><text x="112" y="276" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="276" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Do you work in Arabic, or translate into it?</text><line x1="168" y1="301" x2="1136" y2="301" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="334" r="21" fill="#10214a"/><text x="112" y="342" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="342" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What does a public relations agency in Dubai know about my</text><text x="168" y="375" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">regulator?</text><line x1="168" y1="400" x2="1136" y2="400" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="434" r="21" fill="#10214a"/><text x="112" y="442" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="442" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">How does a public relations agency in Dubai measure a result?</text><line x1="168" y1="467" x2="1136" y2="467" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="501" r="21" fill="#10214a"/><text x="112" y="509" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="509" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Who is on the account when the public relations agency in Dubai is</text><text x="168" y="541" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">busy?</text><line x1="168" y1="566" x2="1136" y2="566" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="600" r="21" fill="#10214a"/><text x="112" y="608" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="608" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What happens when the story is bad?</text><line x1="168" y1="633" x2="1136" y2="633" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="667" r="21" fill="#10214a"/><text x="112" y="675" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">7</text><text x="168" y="675" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What would make you tell us to stop?</text>
  <text x="1136" y="756" fill="#4a5672" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="600">sndigitalsolns.com</text>
</svg>
