  <rect x="0" y="0" width="10" height="818" rx="5" fill="#eaa225"/>
  <text x="64" y="98" fill="#10214a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="34" font-weight="800">At a glance</text>
  <line x1="64" y1="126" x2="1136" y2="126" stroke="#dfe4ee" stroke-width="2"/>
  <circle cx="112" cy="168" r="21" fill="#10214a"/><text x="112" y="176" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">1</text><text x="168" y="176" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Show me a b2b marketing agency dashboard, not a case study</text><line x1="168" y1="201" x2="1136" y2="201" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="235" r="21" fill="#10214a"/><text x="112" y="243" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">2</text><text x="168" y="243" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What did you get wrong on your last engagement?</text><line x1="168" y1="268" x2="1136" y2="268" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="302" r="21" fill="#10214a"/><text x="112" y="310" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">3</text><text x="168" y="310" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Who actually does the work?</text><line x1="168" y1="335" x2="1136" y2="335" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="368" r="21" fill="#10214a"/><text x="112" y="376" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">4</text><text x="168" y="376" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What is the first thing you would change, before any spend?</text><line x1="168" y1="401" x2="1136" y2="401" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="435" r="21" fill="#10214a"/><text x="112" y="443" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">5</text><text x="168" y="443" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">How do you define a lead?</text><line x1="168" y1="468" x2="1136" y2="468" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="502" r="21" fill="#10214a"/><text x="112" y="510" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">6</text><text x="168" y="510" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What happens in month one, and what should I expect not to see?</text><line x1="168" y1="535" x2="1136" y2="535" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="569" r="21" fill="#10214a"/><text x="112" y="577" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">7</text><text x="168" y="577" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What do you need from us, and what happens if we are slow?</text><line x1="168" y1="602" x2="1136" y2="602" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="635" r="21" fill="#10214a"/><text x="112" y="643" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">8</text><text x="168" y="643" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">Can I talk to a client who left?</text><line x1="168" y1="668" x2="1136" y2="668" stroke="#dfe4ee" stroke-width="1"/><circle cx="112" cy="702" r="21" fill="#10214a"/><text x="112" y="710" fill="#eaa225" text-anchor="middle" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="800">9</text><text x="168" y="710" fill="#0f172a" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="26" font-weight="600">What would make you tell us to stop?</text>
  <text x="1136" y="792" fill="#4a5672" text-anchor="end" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="19" font-weight="600">sndigitalsolns.com</text>
